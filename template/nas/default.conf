# nginx-Konfiguration für den Container "camper-tagebuch" (nginx:alpine).
# Liegt auf der NAS unter /volume1/docker/camper-tagebuch/conf/default.conf
# und wird nach /etc/nginx/conf.d/default.conf gemountet.
#
# Passwortschutz: htpasswd-Datei nach /volume1/docker/camper-tagebuch/conf/.htpasswd legen
# (gemountet nach /etc/nginx/.htpasswd). Erzeugen z. B. mit
#   docker run --rm httpd:alpine htpasswd -nbB <user> '<passwort>' >> .htpasswd
# Im LAN/VPN ohne Passwort, von außen (über den Reverse Proxy) mit Passwort: siehe "satisfy any".

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Zugriff: aus dem LAN/VPN frei, sonst Basic Auth
  satisfy any;
  allow 192.168.178.0/24;
  allow 10.0.0.0/8;
  deny all;
  auth_basic "Camper-Tour 2026";
  auth_basic_user_file /etc/nginx/.htpasswd;

  gzip on;
  gzip_types text/html application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Seite und Daten nie hart cachen – sonst kommen neue Tage nicht an
  location = / { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /data/ { add_header Cache-Control "no-cache"; }

  # Fotos, Videos, POI-Bilder und gehashte Assets dürfen lange gecacht werden
  location /photos/ { add_header Cache-Control "public, max-age=2592000"; }
  location /pois/   { add_header Cache-Control "public, max-age=2592000"; }
  location /video/  { add_header Cache-Control "public, max-age=2592000"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ /index.html; }
}
